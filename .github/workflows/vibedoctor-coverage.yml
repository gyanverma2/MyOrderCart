name: VibeDoctor coverage
on:
  push:
    branches: [vibedoctor-coverage-e2e]
  pull_request:
jobs:
  test:
    runs-on: windows-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: '5.0.x'
      - run: dotnet test nkv.MyOrderCart/nkv.MyOrderCart.sln --collect:"XPlat Code Coverage"
      - uses: ./.github/actions/vibedoctor
        if: ${{ !cancelled() }}
        with:
          coverage-file: '**/coverage.cobertura.xml'
          api-url: https://smee.io/Yny9NTysT8hZD7Yt
